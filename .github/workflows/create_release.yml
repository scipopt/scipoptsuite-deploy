name: Create Release

# Triggered when a release PR is merged to main (build_binaries.yml has changed).
# Finds the matching successful Build Binaries run (all build configs) on the release-X.Y.Z branch,
# downloads its artifacts, and publishes a GitHub release tagged on the merge commit.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build_binaries.yml'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Read versions from workflow file
        id: versions
        run: |
          file=".github/workflows/build_binaries.yml"
          read_default() {
              sed -n "/${1}:/,/default:/{s/.*default: \"\(.*\)\"/\1/p;}" "$file"
          }
          {
              echo "scip=$(read_default scip_version)"
              echo "soplex=$(read_default soplex_version)"
              echo "gcg=$(read_default gcg_version)"
              echo "ipopt=$(read_default ipopt_version)"
          } >> "$GITHUB_OUTPUT"

      - name: Skip if a release for these versions already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="SCIP ${{ steps.versions.outputs.scip }} SOPLEX ${{ steps.versions.outputs.soplex }} GCG ${{ steps.versions.outputs.gcg }} IPOPT ${{ steps.versions.outputs.ipopt }}"
          if gh release list --json name --jq '.[].name' | grep -Fxq "$title"; then
              echo "Release '$title' already exists; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
          else
              echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find the merged PR and check it's a release
        if: steps.check.outputs.skip != 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the PR whose merge commit matches this push
          read -r pr_head pr_branch < <(gh pr list --state merged --base main \
              --json mergeCommit,headRefOid,headRefName \
              --jq ".[] | select(.mergeCommit.oid == \"$GITHUB_SHA\") | \"\(.headRefOid) \(.headRefName)\"")
          if [[ -z "$pr_head" ]]; then
              echo "No merged PR found for commit $GITHUB_SHA; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          if [[ "$pr_branch" != release-* ]]; then
              echo "PR branch '$pr_branch' is not a release branch; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "head_sha=$pr_head" >> "$GITHUB_OUTPUT"

      - name: Find the successful Build Binaries run for that commit
        if: steps.check.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One run builds every config. Take the newest successful one that built the
          # release config (it has merged-artifacts); runs that built only variants don't count.
          for id in $(gh run list \
                  --workflow=build_binaries.yml \
                  --commit "${{ steps.pr.outputs.head_sha }}" \
                  --status success \
                  --limit 20 \
                  --json databaseId --jq '.[].databaseId'); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                      --jq '.artifacts[].name' | grep -Fxq merged-artifacts; then
                  echo "id=$id" >> "$GITHUB_OUTPUT"
                  exit 0
              fi
          done
          echo "Error: no successful Build Binaries run with the release build found for commit ${{ steps.pr.outputs.head_sha }}."
          echo "Builds must complete successfully on the release branch before merging."
          exit 1

      - name: Download artifacts from the build run
        if: steps.check.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ steps.run.outputs.id }}" --dir artifacts
          # variants are optional: a failed one doesn't fail the run, it's just missing here
          for config in debug exact; do
              for platform in linux linux-arm macos-arm macos-intel windows; do
                  [[ -f "artifacts/$platform-$config/libscip-$platform-$config.zip" ]] ||
                      echo "::warning::No $config build for $platform; releasing without it."
              done
          done

      - name: Compute next release tag
        if: steps.check.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          if [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              next="v${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1)).0"
          else
              echo "Error: could not parse latest release tag '$latest' (expected vX.Y.Z)"
              exit 1
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Next release tag: $next"

      - name: Bundle merged-artifacts.zip
        if: steps.check.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        run: |
          (cd artifacts/merged-artifacts && zip -r ../../merged-artifacts.zip .)

      - name: Create GitHub release
        if: steps.check.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="SCIP ${{ steps.versions.outputs.scip }} SOPLEX ${{ steps.versions.outputs.soplex }} GCG ${{ steps.versions.outputs.gcg }} IPOPT ${{ steps.versions.outputs.ipopt }}"
          # every per-platform zip from every downloaded run; merged-artifacts holds duplicates
          mapfile -t zips < <(find artifacts -name 'libscip-*.zip' -not -path '*/merged-artifacts/*' | sort)
          printf 'Attaching %s\n' "${zips[@]}"
          gh release create "${{ steps.tag.outputs.tag }}" \
              --title "$title" \
              --target "$GITHUB_SHA" \
              "${zips[@]}" \
              merged-artifacts.zip
