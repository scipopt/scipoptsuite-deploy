name: Build Binaries


# Authors: 
# Mark Turner
# Mohammed Ghannam 
# Stefan Vigerske
# Franziska Schloesser
# Julian Manns
# Michael Winkler
#
# This is the base workflow script for generating SCIP libraries.
# These libraries intended purpose is to be shipped with the various 
# SCIP interfaces for different programming languages (e.g. Python and Rust).
# These libraries enable users of those interfaces to not have to install SCIP themselves outside of
# the traditional package managers of their preferred programming languages.
# For example, pip install pyscipopt will now install SCIP on the users machine directly.
#
# A major issue with the development of these scripts was to statically generate
# as many dependencies as possible. This way users require a minimal amount
# of system libraries to actually install via their preferred programming language.
# Any extensions to this script should keep this design philosophy in mind.
#
# Current support:
# Linux x86-64
# Linux ARM64
# MacOS x86-64
# MacOS ARM64
# Windows x86-64
#

on:
    workflow_dispatch:
        inputs:
            gcg_version:
                type: string
                description: GCG version to use
                required: true
                default: "4.1.0"
            scip_version:
                type: string
                description: SCIP version to use
                required: true
                default: "10.1.0"
            soplex_version:
                type: string
                description: Soplex version to use
                required: true
                default: "8.1.0"
            ipopt_version:
                type: string
                description: IPOPT version to use
                required: true
                default: "3.14.19"
            linux:
                type: boolean
                description: Build for Linux (Intel and ARM)
                required: false
                default: true
            macos:
                type: boolean
                description: Build for macOS (Intel and ARM)
                required: false
                default: true
            windows:
                type: boolean
                description: Build for Windows
                required: false
                default: true
            # Each build config is independent: debug toggles assertions, exact toggles exact rational solving.
            release:
                type: boolean
                description: "Build release (normal build)"
                default: true
            debug:
                type: boolean
                description: "Build debug (assertions on)"
                default: true
            exact:
                type: boolean
                description: "Build exact (exact rational solving with GMP/MPFR)"
                default: true
            exact_debug:
                type: boolean
                description: "Build exact-debug (exact, with assertions on)"
                default: false
            tests:
                type: boolean
                description: Run tests
                default: true
            # static:
                # type: boolean
                # description: Build static libraries
                # default: false
            use_cached_dependencies:
                type: boolean
                description: Use cached dependencies
                default: true

jobs:
    print-inputs:
      runs-on: ubuntu-latest
      outputs:
          configs: ${{ steps.configs.outputs.configs }}
      steps:
          - name: Print inputs
            run: |
              echo "SCIP version: ${{github.event.inputs.scip_version}}"
              echo "GCG version: ${{github.event.inputs.gcg_version}}"
              echo "Soplex version: ${{github.event.inputs.soplex_version}}"
              echo "IPOPT version: ${{github.event.inputs.ipopt_version}}"
              echo "Build configs: release=${{inputs.release}} debug=${{inputs.debug}} exact=${{inputs.exact}} exact_debug=${{inputs.exact_debug}}"
              echo "Static?: ${{github.event.inputs.static}}"
              echo "Use cached dependncies?: ${{github.event.inputs.use_cached_dependencies}}"
          - name: Select build configs
            id: configs
            run: |
              # release artifacts keep their historical names; the others get a suffix so they never collide
              configs=()
              [ "${{ inputs.release }}" = true ] && configs+=('{"name":"release","debug":false,"exact":false,"suffix":""}')
              [ "${{ inputs.debug }}" = true ] && configs+=('{"name":"debug","debug":true,"exact":false,"suffix":"-debug"}')
              [ "${{ inputs.exact }}" = true ] && configs+=('{"name":"exact","debug":false,"exact":true,"suffix":"-exact"}')
              [ "${{ inputs.exact_debug }}" = true ] && configs+=('{"name":"exact-debug","debug":true,"exact":true,"suffix":"-exact-debug"}')
              if [ ${#configs[@]} -eq 0 ]; then
                  echo "::error::Select at least one build config."
                  exit 1
              fi
              echo "configs=[$(IFS=,; echo "${configs[*]}")]" >> "$GITHUB_OUTPUT"

    macos-arm-build-binaries:
        runs-on: macos-14
        if: github.event.inputs.macos == 'true'
        name: macOS ARM (${{ matrix.config.name }})
        needs: print-inputs
        strategy:
          fail-fast: false
          matrix:
            config: ${{ fromJSON(needs.print-inputs.outputs.configs) }}
        # only the release build is required; a failed variant leaves the run green and is just not published
        continue-on-error: ${{ matrix.config.name != 'release' }}
        env:
          BUILD_MODE: ${{ matrix.config.debug && 'Debug' || 'Release' }}
          EXACT: ${{ matrix.config.exact && 'ON' || 'OFF' }}
          SUFFIX: ${{ matrix.config.suffix }}
        steps:
            - uses: actions/checkout@v4
            - name: Build and install SCIP
              run: |
                export SCIP_VERSION=$(echo "${{github.event.inputs.scip_version}}" | tr -d '.')
                export SCIP_VERSION_FULL="${{ github.event.inputs.scip_version }}"
                export GCG_VERSION=$(echo "${{github.event.inputs.gcg_version}}" | tr -d '.')
                export GCG_VERSION_FULL="${{ github.event.inputs.gcg_version }}"
                export SOPLEX_VERSION=$(echo "${{github.event.inputs.soplex_version}}" | tr -d '.')
                export SOPLEX_VERSION_FULL="${{ github.event.inputs.soplex_version }}"
                export IPOPT_VERSION=${{ github.event.inputs.ipopt_version }}
                if [ "${{github.event.inputs.static}}" = "true" ]; then
                    export SHARED=OFF
                else
                    export SHARED=ON
                fi
                
                if [ "${{github.event.inputs.tests}}" = "true" ]; then
                    export TESTS=ON
                fi

                if [ "${{github.event.inputs.use_cached_dependencies}}" = "true" ]; then
                    export USE_CACHED_DEPENDENCIES=OFF
                else
                    export USE_CACHED_DEPENDENCIES=ON
                fi 

                bash -x .github/workflows/scripts/macos_arm.bash

            - uses: actions/upload-artifact@v4
              with:
                name: macos-arm${{ matrix.config.suffix }}
                path: ${{ github.workspace }}/libscip-macos-arm${{ matrix.config.suffix }}.zip

    macos-intel-build-binaries:
      runs-on: macos-15-intel
      if: github.event.inputs.macos == 'true'
      name: macOS Intel (${{ matrix.config.name }})
      needs: print-inputs
      strategy:
        fail-fast: false
        matrix:
          config: ${{ fromJSON(needs.print-inputs.outputs.configs) }}
      # only the release build is required; a failed variant leaves the run green and is just not published
      continue-on-error: ${{ matrix.config.name != 'release' }}
      env:
        BUILD_MODE: ${{ matrix.config.debug && 'Debug' || 'Release' }}
        EXACT: ${{ matrix.config.exact && 'ON' || 'OFF' }}
        SUFFIX: ${{ matrix.config.suffix }}
      steps:
        - uses: actions/checkout@v4
        - uses: fortran-lang/setup-fortran@v1
          id: setup-fortran
          with:
            compiler: gcc
            version: 13
        - name: Build and install SCIP
          run: |
            export SCIP_VERSION=$(echo "${{github.event.inputs.scip_version}}" | tr -d '.')
            export SCIP_VERSION_FULL="${{ github.event.inputs.scip_version }}"
            export GCG_VERSION=$(echo "${{github.event.inputs.gcg_version}}" | tr -d '.')
            export GCG_VERSION_FULL="${{ github.event.inputs.gcg_version }}"
            export SOPLEX_VERSION=$(echo "${{github.event.inputs.soplex_version}}" | tr -d '.')
            export SOPLEX_VERSION_FULL="${{ github.event.inputs.soplex_version }}"
            export IPOPT_VERSION=${{ github.event.inputs.ipopt_version }}
            if [ "${{github.event.inputs.static}}" = "true" ]; then
                export SHARED=OFF
            else
                export SHARED=ON
            fi
            
            if [ "${{github.event.inputs.tests}}" = "true" ]; then
                export TESTS=ON
            fi

            if [ "${{github.event.inputs.use_cached_dependencies}}" = "true" ]; then
                export USE_CACHED_DEPENDENCIES=OFF
            else
                export USE_CACHED_DEPENDENCIES=ON
            fi            
            

            bash -x .github/workflows/scripts/macos.bash

        - uses: actions/upload-artifact@v4
          with:
            name: macos-intel${{ matrix.config.suffix }}
            path: ${{ github.workspace }}/libscip-macos-intel${{ matrix.config.suffix }}.zip

    linux-build-binaries:
        runs-on: ubuntu-latest
        if: github.event.inputs.linux == 'true'
        name: Linux (${{ matrix.config.name }})
        needs: print-inputs
        strategy:
          fail-fast: false
          matrix:
            config: ${{ fromJSON(needs.print-inputs.outputs.configs) }}
        # only the release build is required; a failed variant leaves the run green and is just not published
        continue-on-error: ${{ matrix.config.name != 'release' }}
        env:
          BUILD_MODE: ${{ matrix.config.debug && 'Debug' || 'Release' }}
          EXACT: ${{ matrix.config.exact && 'ON' || 'OFF' }}
          SUFFIX: ${{ matrix.config.suffix }}
        container: quay.io/pypa/manylinux_2_28_x86_64
        steps:
            - uses: actions/checkout@v4
            - name: Build and install SCIP
              run: |
                export SCIP_VERSION=$(echo "${{github.event.inputs.scip_version}}" | tr -d '.')
                export SCIP_VERSION_FULL="${{ github.event.inputs.scip_version }}"
                export GCG_VERSION=$(echo "${{github.event.inputs.gcg_version}}" | tr -d '.')
                export GCG_VERSION_FULL="${{ github.event.inputs.gcg_version }}"
                export SOPLEX_VERSION=$(echo "${{github.event.inputs.soplex_version}}" | tr -d '.')
                export SOPLEX_VERSION_FULL="${{ github.event.inputs.soplex_version }}"
                export IPOPT_VERSION=${{ github.event.inputs.ipopt_version }}
                if [ "${{github.event.inputs.static}}" = "true" ]; then
                    export SHARED=OFF
                else
                    export SHARED=ON
                fi

                if [ "${{github.event.inputs.tests}}" = "true" ]; then
                    export TESTS=ON
                fi

                if [ "${{github.event.inputs.use_cached_dependencies}}" = "true" ]; then
                    export USE_CACHED_DEPENDENCIES=OFF
                else
                    export USE_CACHED_DEPENDENCIES=ON
                fi

                export ARM=OFF

                bash -x .github/workflows/scripts/linux.bash
            - uses: actions/upload-artifact@v4
              with:
                name: linux${{ matrix.config.suffix }}
                path: ${{ github.workspace }}/libscip-linux${{ matrix.config.suffix }}.zip

    linux-arm-build-binaries:
        runs-on: ubuntu-24.04-arm
        if: github.event.inputs.linux == 'true'
        name: Linux ARM (${{ matrix.config.name }})
        needs: print-inputs
        strategy:
          fail-fast: false
          matrix:
            config: ${{ fromJSON(needs.print-inputs.outputs.configs) }}
        # only the release build is required; a failed variant leaves the run green and is just not published
        continue-on-error: ${{ matrix.config.name != 'release' }}
        env:
          BUILD_MODE: ${{ matrix.config.debug && 'Debug' || 'Release' }}
          EXACT: ${{ matrix.config.exact && 'ON' || 'OFF' }}
          SUFFIX: ${{ matrix.config.suffix }}
        container: quay.io/pypa/manylinux_2_28_aarch64
        steps:
            - uses: actions/checkout@v4
            - name: Build and install SCIP
              run: |
                export SCIP_VERSION=$(echo "${{github.event.inputs.scip_version}}" | tr -d '.')
                export SCIP_VERSION_FULL="${{ github.event.inputs.scip_version }}"
                export GCG_VERSION=$(echo "${{github.event.inputs.gcg_version}}" | tr -d '.')
                export GCG_VERSION_FULL="${{ github.event.inputs.gcg_version }}"
                export SOPLEX_VERSION=$(echo "${{github.event.inputs.soplex_version}}" | tr -d '.')
                export SOPLEX_VERSION_FULL="${{ github.event.inputs.soplex_version }}"
                export IPOPT_VERSION=${{ github.event.inputs.ipopt_version }}
                if [ "${{github.event.inputs.static}}" = "true" ]; then
                    export SHARED=OFF
                else
                    export SHARED=ON
                fi

                if [ "${{github.event.inputs.tests}}" = "true" ]; then
                    export TESTS=ON
                fi

                if [ "${{github.event.inputs.use_cached_dependencies}}" = "true" ]; then
                    export USE_CACHED_DEPENDENCIES=OFF
                else
                    export USE_CACHED_DEPENDENCIES=ON
                fi

                export ARM=ON
                bash -x .github/workflows/scripts/linux.bash
            - uses: actions/upload-artifact@v4
              with:
                name: linux-arm${{ matrix.config.suffix }}
                path: ${{ github.workspace }}/libscip-linux-arm${{ matrix.config.suffix }}.zip

    windows-build-binaries:
        runs-on: windows-latest
        if: github.event.inputs.windows == 'true'
        name: Windows (${{ matrix.config.name }})
        needs: print-inputs
        strategy:
          fail-fast: false
          matrix:
            config: ${{ fromJSON(needs.print-inputs.outputs.configs) }}
        # only the release build is required; a failed variant leaves the run green and is just not published
        continue-on-error: ${{ matrix.config.name != 'release' }}
        env:
          BUILD_MODE: ${{ matrix.config.debug && 'Debug' || 'Release' }}
          EXACT: ${{ matrix.config.exact && 'ON' || 'OFF' }}
          SUFFIX: ${{ matrix.config.suffix }}
        steps:
          - uses: actions/checkout@v4
          - uses: msys2/setup-msys2@v2

          - name: Build and install SCIP
            run:  |
              export SCIP_VERSION=$(echo "${{github.event.inputs.scip_version}}" | tr -d '.')
              export SCIP_VERSION_FULL="${{ github.event.inputs.scip_version }}"
              export GCG_VERSION=$(echo "${{github.event.inputs.gcg_version}}" | tr -d '.')
              export GCG_VERSION_FULL="${{ github.event.inputs.gcg_version }}"
              export SOPLEX_VERSION=$(echo "${{github.event.inputs.soplex_version}}" | tr -d '.')
              export SOPLEX_VERSION_FULL="${{ github.event.inputs.soplex_version }}"
              export IPOPT_VERSION=${{ github.event.inputs.ipopt_version }}
              if [ "${{github.event.inputs.static}}" = "true" ]; then
                  export SHARED=OFF
              else
                  export SHARED=ON
              fi

              if [ "${{github.event.inputs.tests}}" = "true" ]; then
                  export TESTS=ON
              fi

              if [ "${{github.event.inputs.use_cached_dependencies}}" = "true" ]; then
                  export USE_CACHED_DEPENDENCIES=OFF
              else
                  export USE_CACHED_DEPENDENCIES=ON
              fi
              
              bash -x .github/workflows/scripts/windows.bash
            shell: msys2 {0}

          - uses: actions/upload-artifact@v4
            with:
              name: windows${{ matrix.config.suffix }}
              path: ${{ github.workspace }}/libscip-windows${{ matrix.config.suffix }}.zip

    merge_artifacts:
      name: Merge Artifacts
      needs: [ windows-build-binaries, linux-build-binaries, linux-arm-build-binaries, macos-intel-build-binaries, macos-arm-build-binaries ]
      # merged-artifacts holds the release build only, as before
      if: ${{ !cancelled() && inputs.release }}
      runs-on: ubuntu-latest
      steps:
        - name: Merge Artifacts
          uses: actions/upload-artifact/merge@v4
          with:
            pattern: "{linux,linux-arm,macos-arm,macos-intel,windows}"
