name: Build Binaries


# Authors: 
# Mark Turner
# Mohammed Ghannam 
# Stefan Vigerske
# Franziska Schloesser
# Julian Manns
# Michael Winkler
#
# This is the base workflow script for generating SCIP libraries.
# These libraries intended purpose is to be shipped with the various 
# SCIP interfaces for different programming languages (e.g. Python and Rust).
# These libraries enable users of those interfaces to not have to install SCIP themselves outside of
# the traditional package managers of their preferred programming languages.
# For example, pip install pyscipopt will now install SCIP on the users machine directly.
#
# A major issue with the development of these scripts was to statically generate
# as many dependencies as possible. This way users require a minimal amount
# of system libraries to actually install via their preferred programming language.
# Any extensions to this script should keep this design philosophy in mind.
#
# Current support:
# Linux x86-64
# Linux ARM64
# MacOS x86-64
# MacOS ARM64
# Windows x86-64
#

on:
    workflow_dispatch:
        inputs:
            gcg_version:
                type: string
                description: GCG version to use
                required: true
                default: "4.1.0"
            scip_version:
                type: string
                description: SCIP version to use
                required: true
                default: "10.1.0"
            soplex_version:
                type: string
                description: Soplex version to use
                required: true
                default: "8.1.0"
            ipopt_version:
                type: string
                description: IPOPT version to use
                required: true
                default: "3.14.19"
            linux:
                type: boolean
                description: Build for Linux (Intel and ARM)
                required: false
                default: true
            macos:
                type: boolean
                description: Build for macOS (Intel and ARM)
                required: false
                default: true
            windows:
                type: boolean
                description: Build for Windows
                required: false
                default: true
            # Every combination of the two is built: release, plus debug, exact and exact-debug when checked.
            debug:
                type: boolean
                description: "Also build with assertions on (debug)"
                default: false
            exact:
                type: boolean
                description: "Also build with exact rational solving, using GMP/MPFR (exact)"
                default: false
            tests:
                type: boolean
                description: Run tests
                default: true
            # static:
                # type: boolean
                # description: Build static libraries
                # default: false

env:
    SCIP_VERSION_FULL: ${{ inputs.scip_version }}
    SOPLEX_VERSION_FULL: ${{ inputs.soplex_version }}
    GCG_VERSION_FULL: ${{ inputs.gcg_version }}
    IPOPT_VERSION: ${{ inputs.ipopt_version }}
    SHARED: "ON"  # the static input is disabled above
    TESTS: ${{ inputs.tests && 'ON' || 'OFF' }}

jobs:
    setup:
      runs-on: ubuntu-latest
      outputs:
        matrix: ${{ steps.matrix.outputs.matrix }}
      steps:
          - name: Print inputs
            run: |
              echo "SCIP version: $SCIP_VERSION_FULL"
              echo "GCG version: $GCG_VERSION_FULL"
              echo "Soplex version: $SOPLEX_VERSION_FULL"
              echo "IPOPT version: $IPOPT_VERSION"
              echo "Platforms: linux=${{ inputs.linux }} macos=${{ inputs.macos }} windows=${{ inputs.windows }}"
              echo "Debug builds?: ${{ inputs.debug }}"
              echo "Exact builds?: ${{ inputs.exact }}"

          # every enabled platform, crossed with every enabled config
          - name: Build matrix
            id: matrix
            env:
              LINUX: ${{ inputs.linux }}
              MACOS: ${{ inputs.macos }}
              WINDOWS: ${{ inputs.windows }}
              DEBUG: ${{ inputs.debug }}
              EXACT: ${{ inputs.exact }}
            run: |
              matrix=$(jq -nc --argjson linux "$LINUX" --argjson macos "$MACOS" --argjson windows "$WINDOWS" \
                  --argjson debug "$DEBUG" --argjson exact "$EXACT" '
                [
                  {platform: "linux",       name: "Linux",       os: "ubuntu-latest",    container: "quay.io/pypa/manylinux_2_28_x86_64",  shell: "bash",       script: "linux.bash",     on: $linux},
                  {platform: "linux-arm",   name: "Linux ARM",   os: "ubuntu-24.04-arm", container: "quay.io/pypa/manylinux_2_28_aarch64", shell: "bash",       script: "linux.bash",     on: $linux},
                  {platform: "macos-intel", name: "macOS Intel", os: "macos-15-intel",   container: null,                                  shell: "bash",       script: "macos.bash",     on: $macos},
                  {platform: "macos-arm",   name: "macOS ARM",   os: "macos-14",         container: null,                                  shell: "bash",       script: "macos_arm.bash", on: $macos},
                  {platform: "windows",     name: "Windows",     os: "windows-latest",   container: null,                                  shell: "msys2 {0}",  script: "windows.bash",   on: $windows}
                ]
                | map(select(.on) | del(.on))
                | [.[] as $p
                   | ([false] + if $debug then [true] else [] end)[] as $d
                   | ([false] + if $exact then [true] else [] end)[] as $e
                   | $p + {debug: $d, exact: $e}]
                | {include: .}')
              echo "$matrix"
              echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    build-binaries:
      needs: setup
      name: ${{ matrix.name }}${{ matrix.exact && ' exact' || '' }}${{ matrix.debug && ' debug' || '' }}
      runs-on: ${{ matrix.os }}
      # null for macOS and Windows, which build on the runner itself
      container:
        image: ${{ matrix.container }}
      defaults:
        run:
          shell: ${{ matrix.shell }}
      strategy:
        fail-fast: false
        matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
      # only the release build is required; a failed variant leaves the run green and is just not published
      continue-on-error: ${{ matrix.debug || matrix.exact }}
      env:
        BUILD_MODE: ${{ matrix.debug && 'Debug' || 'Release' }}
        EXACT: ${{ matrix.exact && 'ON' || 'OFF' }}
        # release zips keep their historical names; the others get -exact, -debug or -exact-debug
        SUFFIX: ${{ matrix.exact && '-exact' || '' }}${{ matrix.debug && '-debug' || '' }}
        ARM: ${{ matrix.platform == 'linux-arm' && 'ON' || 'OFF' }}
      steps:
        - uses: actions/checkout@v4

        - if: matrix.platform == 'macos-intel'
          uses: fortran-lang/setup-fortran@v1
          with:
            compiler: gcc
            version: 13

        - if: matrix.platform == 'windows'
          uses: msys2/setup-msys2@v2

        - name: Build and install SCIP
          run: bash -x .github/workflows/scripts/${{ matrix.script }}

        - uses: actions/upload-artifact@v4
          with:
            name: ${{ matrix.platform }}${{ env.SUFFIX }}
            path: ${{ github.workspace }}/libscip-${{ matrix.platform }}${{ env.SUFFIX }}.zip

    merge_artifacts:
      name: Merge Artifacts
      needs: build-binaries
      # merged-artifacts holds the release build only, as before
      if: ${{ !cancelled() }}
      runs-on: ubuntu-latest
      steps:
        - name: Merge Artifacts
          uses: actions/upload-artifact/merge@v4
          with:
            pattern: "{linux,linux-arm,macos-arm,macos-intel,windows}"
