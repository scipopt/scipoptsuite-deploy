name: Build Binaries


# Authors: 
# Mark Turner
# Mohammed Ghannam 
# Stefan Vigerske
# Franziska Schloesser
# Julian Manns
# Michael Winkler
#
# This is the base workflow script for generating SCIP libraries.
# These libraries intended purpose is to be shipped with the various 
# SCIP interfaces for different programming languages (e.g. Python and Rust).
# These libraries enable users of those interfaces to not have to install SCIP themselves outside of
# the traditional package managers of their preferred programming languages.
# For example, pip install pyscipopt will now install SCIP on the users machine directly.
#
# A major issue with the development of these scripts was to statically generate
# as many dependencies as possible. This way users require a minimal amount
# of system libraries to actually install via their preferred programming language.
# Any extensions to this script should keep this design philosophy in mind.
#
# Current support:
# Linux x86-64
# Linux ARM64
# MacOS x86-64
# MacOS ARM64
# Windows x86-64
#

on:
    workflow_dispatch:
        inputs:
            gcg_version:
                type: string
                description: GCG version to use
                required: true
                default: "4.1.0"
            scip_version:
                type: string
                description: SCIP version to use
                required: true
                default: "10.1.0"
            soplex_version:
                type: string
                description: Soplex version to use
                required: true
                default: "8.1.0"
            ipopt_version:
                type: string
                description: IPOPT version to use
                required: true
                default: "3.14.19"
            linux:
                type: boolean
                description: Build for Linux (Intel and ARM)
                required: false
                default: true
            macos:
                type: boolean
                description: Build for macOS (Intel and ARM)
                required: false
                default: true
            windows:
                type: boolean
                description: Build for Windows
                required: false
                default: true
            debug:
                type: boolean
                description: Build in debug mode
                required: false
                default: false
            tests:
                type: boolean
                description: Run tests
                default: true
            rebuild:
                type: boolean
                description: Rebuild everything, ignoring cached builds and dependencies
                default: false
            # static:
                # type: boolean
                # description: Build static libraries
                # default: false

jobs:
    setup:
      runs-on: ubuntu-latest
      outputs:
        platforms: ${{ steps.platforms.outputs.platforms }}
      steps:
          - name: Platforms
            id: platforms
            env:
              LINUX: ${{ inputs.linux }}
              MACOS: ${{ inputs.macos }}
              WINDOWS: ${{ inputs.windows }}
            run: |
              platforms=$(jq -nc --argjson linux "$LINUX" --argjson macos "$MACOS" --argjson windows "$WINDOWS" '[
                  {id: "linux",       name: "Linux",       os: "ubuntu-latest",    container: "quay.io/pypa/manylinux_2_28_x86_64",  shell: "bash",      script: "linux.bash",     enabled: $linux},
                  {id: "linux-arm",   name: "Linux ARM",   os: "ubuntu-24.04-arm", container: "quay.io/pypa/manylinux_2_28_aarch64", shell: "bash",      script: "linux.bash",     enabled: $linux},
                  {id: "macos-intel", name: "macOS Intel", os: "macos-15-intel",   container: null,                                  shell: "bash",      script: "macos.bash",     enabled: $macos},
                  {id: "macos-arm",   name: "macOS ARM",   os: "macos-15",         container: null,                                  shell: "bash",      script: "macos_arm.bash", enabled: $macos},
                  {id: "windows",     name: "Windows",     os: "windows-latest",   container: null,                                  shell: "msys2 {0}", script: "windows.bash",   enabled: $windows}
                ] | map(select(.enabled))')
              echo "$platforms"
              echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

    build-binaries:
      needs: setup
      name: ${{ matrix.platform.name }}
      runs-on: ${{ matrix.platform.os }}
      # none on macOS and Windows
      container:
        image: ${{ matrix.platform.container }}
      defaults:
        run:
          shell: ${{ matrix.platform.shell }}
      strategy:
        fail-fast: false
        matrix:
          platform: ${{ fromJSON(needs.setup.outputs.platforms) }}
      env:
        SCIP_VERSION_FULL: ${{ inputs.scip_version }}
        SOPLEX_VERSION_FULL: ${{ inputs.soplex_version }}
        GCG_VERSION_FULL: ${{ inputs.gcg_version }}
        IPOPT_VERSION: ${{ inputs.ipopt_version }}
        SHARED: "ON"  # the static input is disabled above
        BUILD_MODE: ${{ inputs.debug && 'Debug' || 'Release' }}
        TESTS: ${{ inputs.tests && 'ON' || 'OFF' }}
        ARM: ${{ matrix.platform.id == 'linux-arm' && 'ON' || 'OFF' }}
        ZIP: libscip-${{ matrix.platform.id }}.zip
      steps:
        - uses: actions/checkout@v4

        # the zip from an earlier run, if the versions and this platform's scripts are unchanged
        - uses: actions/cache@v4
          id: zip
          if: ${{ !inputs.rebuild }}
          with:
            path: ${{ env.ZIP }}
            key: ${{ env.ZIP }}-${{ env.BUILD_MODE }}-scip${{ env.SCIP_VERSION_FULL }}-soplex${{ env.SOPLEX_VERSION_FULL }}-gcg${{ env.GCG_VERSION_FULL }}-ipopt${{ env.IPOPT_VERSION }}-tests${{ env.TESTS }}-${{ hashFiles(format('.github/workflows/scripts/{0}', matrix.platform.script), format('.github/workflows/scripts/deps/{0}', matrix.platform.script), '.github/workflows/scripts/relocatable_bin.bash') }}

        # deps.tar: MUMPS, Ipopt, METIS (and Boost, LAPACK on Linux), see scripts/deps
        - uses: actions/cache/restore@v4
          id: deps
          if: ${{ steps.zip.outputs.cache-hit != 'true' && matrix.platform.id != 'windows' && !inputs.rebuild }}
          with:
            path: deps.tar
            key: deps-${{ matrix.platform.id }}-ipopt${{ env.IPOPT_VERSION }}-${{ hashFiles(format('.github/workflows/scripts/deps/{0}', matrix.platform.script)) }}

        - if: steps.zip.outputs.cache-hit != 'true' && matrix.platform.id == 'macos-intel'
          uses: fortran-lang/setup-fortran@v1
          with:
            compiler: gcc
            version: 13

        - if: steps.zip.outputs.cache-hit != 'true' && matrix.platform.id == 'windows'
          uses: msys2/setup-msys2@v2

        - name: Build and install SCIP
          if: steps.zip.outputs.cache-hit != 'true'
          run: bash -x .github/workflows/scripts/${{ matrix.platform.script }}

        # saved even if the build fails later, so a rerun skips the dependencies
        - uses: actions/cache/save@v4
          if: ${{ always() && steps.deps.outcome == 'success' && steps.deps.outputs.cache-hit != 'true' && hashFiles('deps.tar') != '' }}
          with:
            path: deps.tar
            key: ${{ steps.deps.outputs.cache-primary-key }}

        - uses: actions/upload-artifact@v4
          with:
            name: ${{ matrix.platform.id }}
            path: ${{ github.workspace }}/${{ env.ZIP }}

    merge_artifacts:
      name: Merge Artifacts
      needs: build-binaries
      runs-on: ubuntu-latest
      steps:
        - name: Merge Artifacts
          uses: actions/upload-artifact/merge@v4
